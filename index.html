<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>Recortador de Imágenes</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="toolbar">
  <button id="btnOpen" class="btn primary">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
    </svg>
    Abrir
  </button>
  <select id="aspectSelect" class="select"></select>
  <div class="spacer"></div>
  <button id="btnReset" class="btn ghost" title="Restablecer">⟲</button>
</header>

<main class="stage">
  <div id="canvasWrap" class="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="placeholder" class="placeholder">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#b0b7c3" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      <p>Abre una imagen para comenzar</p>
    </div>
    <div id="infoBadge" class="info-badge hidden">0 × 0</div>
  </div>
</main>

<footer class="controls">
  <div class="row">
    <label class="checkbox">
      <input type="checkbox" id="keepExif">
      <span>Conservar Metadatos EXIF</span>
    </label>
  </div>
  <div class="row">
    <label class="label">Formato</label>
    <select id="formatSelect" class="select">
      <option value="image/png">PNG</option>
      <option value="image/jpeg" selected>JPEG</option>
      <option value="image/bmp">BMP</option>
      <option value="image/webp">WebP</option>
      <option value="image/avif">AVIF</option>
    </select>

    <label class="label">Calidad</label>
    <input type="range" id="qualityRange" min="10" max="100" value="92" class="range">
    <span id="qualityValue" class="quality-val">92%</span>
  </div>
  <div class="row">
    <button id="btnSave" class="btn primary full" disabled>Guardar imagen</button>
  </div>
</footer>

<input type="file" id="fileInput" accept="image/*" hidden>
<input type="file" id="savePicker" hidden>

<script src="app.js"></script>
</body>
</html>
